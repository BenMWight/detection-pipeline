# Sigma rule template for this project.
#
# Every field below marked REQUIRED is checked by the CI validate step.
# The three custom fields under `project:` are what Criterion 1 is graded on -
# they are not standard Sigma, they exist so your reasoning is in the repo
# rather than in your head.

title: Entra Password Spraying
id: cfcd8d9c-93a4-4cd9-ae67-8b084890c7e0
status: experimental
description: |
  One source IP produces 10 or more failed sign-ins with error 50126, against 10 or more distinct user accounts, within 30 minutes.
author: Ben Wight
date: 2026-09-10

references:
  - https://attack.mitre.org/techniques/T1110/003/

tags:
  - attack.credential_access         # e.g. attack.credential_access
  - attack.t1110.003          # technique id, lowercase

logsource:
  product: azure        # windows, azure, etc
  service: signinlogs       # security, signinlogs, etc

detection:
  selection:
    ResultType: '50126'
  condition: selection

falsepositives:
  - "Shared egress infrastructure. A corporate NAT gateway or VPN concentrator puts many users behind one source IP, which is the exact pattern this rule counts. Normal Monday-morning password failures across a large office can cross the threshold with no attacker involved. This is not just noise: it undermines source IP as a grouping key, and a better version of this rule would group by user agent or ASN as well."
  - "A misconfigured application holding a stale password and retrying against multiple service accounts produces the same signature as a spray."

level: medium 

# Project-specific metadata. Read by the Terraform deploy in Phase 4.
project:
  shape: correlation
  correlation: |
    Aggregation is applied at deploy time, not in the Sigma rule. Base Sigma
    matches single events and cannot express distinct counts over a window.
    The deployed query groups by IPAddress over 30 minutes and alerts when
    dcount(UserPrincipalName) >= 10.
  tuning_deferred: |
    Tuning requires a baseline. In a production tenant I would pull a week of
    SigninLogs, identify the IPs that legitimately produce 50126 failures across
    many accounts, and exclude them. This lab tenant has one user and no
    history, so there is nothing to derive that list from.

    The exclusion has a cost worth stating: every allowlisted IP becomes a blind
    spot. An attacker already inside the corporate network, or with a foothold
    behind the VPN, sprays from an excluded address and this rule never fires.

    query_period is also wrong as configured. The detection window is 30 minutes
    but the period is 1 hour, so a spray straddling the boundary is split across
    two runs and neither half crosses the threshold.
  query_frequency: PT1H
  query_period: PT1H
