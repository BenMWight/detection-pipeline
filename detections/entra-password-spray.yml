# Sigma rule template for this project.
#
# Every field below marked REQUIRED is checked by the CI validate step.
# The three custom fields under `project:` are what Criterion 1 is graded on -
# they are not standard Sigma, they exist so your reasoning is in the repo
# rather than in your head.

title: REQUIRED - short, specific, names the behaviour not the tool
id: REQUIRED - generate a uuid4
status: experimental
description: |
  REQUIRED. What this detects and why it matters. Two or three sentences.
author: Ben Wight
date: YYYY/MM/DD

references:
  - https://attack.mitre.org/techniques/TXXXX/

tags:
  - attack.TACTIC          # e.g. attack.credential_access
  - attack.tXXXX           # technique id, lowercase

logsource:
  product: REQUIRED        # windows, azure, etc
  service: REQUIRED        # security, signinlogs, etc

detection:
  selection:
    FieldName: value
  condition: selection

falsepositives:
  - REQUIRED. Name a concrete actor and behaviour. "Admin activity" scores zero.
    "Backup service account performing bulk reads 0100-0300 daily" scores.

level: low | medium | high | critical

# Project-specific metadata. Read by the Terraform deploy in Phase 4.
project:
  shape: atomic | correlation | anomaly    # REQUIRED - one rule of each
  tuning_deferred: |
    REQUIRED. What tuning you would apply in a real environment, and why you
    have not applied it here.
  query_frequency: PT1H                    # ISO 8601 duration
  query_period: PT1H
