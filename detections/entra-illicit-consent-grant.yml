# Sigma rule template for this project.
#
# Every field below marked REQUIRED is checked by the CI validate step.
# The three custom fields under `project:` are what Criterion 1 is graded on -
# they are not standard Sigma, they exist so your reasoning is in the repo
# rather than in your head.

title: Application registered with unverified publisher domain
id: b51e34a6-8a20-4d95-9323-77e63fbb14f9
status: experimental
description: |
  Detects a new application registration where the publisher domain is the
  tenant's default onmicrosoft.com domain, indicating no verified publisher.
  Malicious OAuth applications used in illicit consent grant attacks are
  typically unverified.

  Limitation: this detects applications registered within our own tenant. In
  the common attack pattern the application is registered in the attacker's
  tenant and only the consent event appears in our logs, which this rule does
  not cover. Detecting that requires the delegated permission grant event.
author: Ben Wight
date: 2026/09/09

references:
  - https://attack.mitre.org/techniques/T1528/

tags:
  - attack.credential_access          # e.g. attack.credential_access
  - attack.t1528          # technique id, lowercase

logsource:
  product: azure       # windows, azure, etc
  service: auditlogs       # security, signinlogs, etc

detection:
  selection:
    OperationName: 'Add application'
    Result: 'success'
    TargetResources|contains: 'PublisherDomain'
  condition: selection

falsepositives:
  - Developer deploys app
  - Anything containing the literal text .onmicrosoft.com anywhere in TargetResource

level:  medium 

# Project-specific metadata. Read by the Terraform deploy in Phase 4.
project:
  shape: atomic 
  tuning_deferred: |
   Review baseline activity.
  query_frequency: PT1H                    # ISO 8601 duration
  query_period: PT1H
