# Sigma rule template for this project.
#
# Every field below marked REQUIRED is checked by the CI validate step.
# The three custom fields under `project:` are what Criterion 1 is graded on -
# they are not standard Sigma, they exist so your reasoning is in the repo
# rather than in your head.

title: Application registered with unverified publisher domain
id: b51e34a6-8a20-4d95-9323-77e63fbb14f9
status: experimental
description: |
  Detects a new application registration where the publisher domain is the
  tenant's default onmicrosoft.com domain, indicating no verified publisher.
  Malicious OAuth applications used in illicit consent grant attacks are
  typically unverified.

  Limitation: this detects applications registered within our own tenant. In
  the common attack pattern the application is registered in the attacker's
  tenant and only the consent event appears in our logs, which this rule does
  not cover. Detecting that requires the delegated permission grant event.
author: Ben Wight
date: 2026/09/09

references:
  - https://attack.mitre.org/techniques/T1528/

tags:
  - attack.credential_access          # e.g. attack.credential_access
  - attack.t1528          # technique id, lowercase

logsource:
  product: azure       # windows, azure, etc
  service: auditlogs       # security, signinlogs, etc

detection:
  selection:
    OperationName: 'Add application'
    Result: 'success'
    TargetResources|contains: 'PublisherDomain'
  filter_verified:
    TargetResources|contains: '.onmicrosoft.com'
  condition: selection and filter_verified

falsepositives:
  - Internal application development. Every line-of-business app registered in
    the tenant starts with the default onmicrosoft.com publisher domain, so in
    any environment with active development this fires routinely. An analyst
    should check whether the registering identity is a known developer or
    service principal, and whether the registration came from the portal or an
    automated pipeline. In the event captured during testing, the user agent
    showed AZURECLI, which indicates automation rather than the browser-based
    consent flow a phishing victim would follow.
    
level:  medium 

# Project-specific metadata. Read by the Terraform deploy in Phase 4.
project:
  shape: atomic 
    tuning_deferred: |
    The detection matches strings against the whole serialised TargetResources
    blob rather than extracting the PublisherDomain field. Any event containing
    ".onmicrosoft.com" anywhere in that structure matches, including one where
    the app's display name happens to contain it.

    With more time the rule would parse modifiedProperties, locate the entry
    where displayName is PublisherDomain, and match only its newValue. That is
    expressible in KQL but not in portable Sigma, so it would move the rule from
    vendor-neutral to Sentinel-specific.
  query_frequency: PT1H                    # ISO 8601 duration
  query_period: PT1H
