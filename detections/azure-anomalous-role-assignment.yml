# Sigma rule template for this project.
#
# Every field below marked REQUIRED is checked by the CI validate step.
# The three custom fields under `project:` are what Criterion 1 is graded on -
# they are not standard Sigma, they exist so your reasoning is in the repo
# rather than in your head.

title: Role assignment outside business hours
id: 7ff23ad4-b6dc-4cb1-8992-c9b4a7855fbf
status: experimental
description: |
  Detects Azure role assignment writes occurring outside defined business
  hours, on the assumption that privilege changes are made during working
  hours by identifiable staff.
author: Ben Wight
date: 2026/09/10

references:
  - https://attack.mitre.org/techniques/T1098/

tags:
  - attack.persistence         # e.g. attack.credential_access
  - attack.t1098          # technique id, lowercase

logsource:
  product: azure        # windows, azure, etc
  service: activitylogs       # security, signinlogs, etc

detection:
  selection:
    FieldName: value
  condition: selection

falsepositives:
  - Scheduled automation. Deployment pipelines and infrastructure-as-code runs
    executing overnight produce role assignments with no human present. In this
    tenant, connecting the workspace to Defender generated four roleAssignments
    writes within seconds, entirely legitimately.
  - On-call engineering. An engineer responding to an incident at 2am assigns
    themselves elevated access to fix something. This is the hard case, because
    it is indistinguishable from an attacker escalating privilege, and the only
    way to separate them is correlating against an incident record outside the
    SIEM.

level: low

# Project-specific metadata. Read by the Terraform deploy in Phase 4.
project:
  shape:  anomaly    # REQUIRED - one rule of each
  tuning_deferred: |
    "Business hours" is undefined and cannot be defined generically. It depends
    on timezone, and a team split across Melbourne and Manila has no single
    answer. In production I would derive the window per-identity from observed
    activity rather than fixing one for the tenant.

    The deeper limitation is the assumption itself. Time-of-day anomaly
    detection assumes an attacker works outside our hours, but a competent one
    works during them precisely to blend in. This rule catches the careless and
    misses the careful, and it should be treated as one weak signal among
    several rather than a standalone detection.
  query_frequency: PT1H                    # ISO 8601 duration
  query_period: PT1H
